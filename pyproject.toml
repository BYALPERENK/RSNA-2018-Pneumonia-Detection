[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna"
version = "0.1.0"
description = "RSNA Pneumonia Detection Challenge: EDA, classification and detection pipeline"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
